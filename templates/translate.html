{% extends "base.html" %}
{% block title %}Translate & Speak - SmartSpeak{% endblock %}
{% block content %}
  <div class="page-header">
    <div class="icon-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
    </div>
    <div>
      <h1>Translate &amp; Speak</h1>
      <p>Translate text to another language and hear it spoken aloud.</p>
    </div>
  </div>

  <div class="card">
    <form method="POST">
      <div class="field">
        <label for="text">Text</label>
        <textarea id="text" name="text" rows="5" placeholder="Enter text to translate" required></textarea>
      </div>
      <div class="field">
        <label for="target_lang">Target language</label>
        <select id="target_lang" name="target_lang" required>
          <option value="">Select target language</option>
          <option value="hi">Hindi</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="te">Telugu</option>
        </select>
      </div>
      <button type="submit">Translate &amp; speak</button>
    </form>

    {% if translated_text %}
    <div class="result">
      <div class="result-label">Translated text</div>
      <p>{{ translated_text }}</p>
      <audio controls>
        <source src="{{ url_for('static', filename=audio_file) }}" type="audio/mpeg">
      </audio>
    </div>
    {% endif %}
  </div>
{% endblock %}

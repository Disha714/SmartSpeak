<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SmartSpeak{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // Applied before paint to avoid a flash of the wrong theme.
    (function () {
      var saved = localStorage.getItem('smartspeak-theme');
      var theme = saved || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a href="/" style="text-decoration:none;">
        <div class="sidebar-header">
          <div class="wave-mark" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="wordmark">SmartSpeak</div>
        </div>
      </a>

      <nav>
        <a href="/tts" class="nav-item {% if active == 'tts' %}active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7"/><path d="M18.5 6a8 8 0 0 1 0 12"/></svg>
          Text to Speech
        </a>
        <a href="/stt" class="nav-item {% if active == 'stt' %}active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M9 21h6"/></svg>
          Speech to Text
        </a>
        <a href="/sentiment" class="nav-item {% if active == 'sentiment' %}active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 6 4-12 2 6h4"/></svg>
          Sentiment to Speech
        </a>
        <a href="/summarize" class="nav-item {% if active == 'summarize' %}active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M9 13h6M9 17h6M9 9h2"/></svg>
          Speech Summarization
        </a>
        <a href="/translate" class="nav-item {% if active == 'translate' %}active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          Translate &amp; Speak
        </a>
        <a href="/image" class="nav-item {% if active == 'image' %}active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5.5-5.5a2 2 0 0 0-2.8 0L4 19"/></svg>
          Image to Speech
        </a>
        <a href="/llm" class="nav-item {% if active == 'llm' %}active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v11H8l-4 4V4z"/></svg>
          Ask AI Chat
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle" type="button">
          <span id="theme-label">Dark mode</span>
          <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </aside>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      var label = document.getElementById('theme-label');

      function sync() {
        var isDark = root.getAttribute('data-theme') === 'dark';
        label.textContent = isDark ? 'Light mode' : 'Dark mode';
      }
      sync();

      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('smartspeak-theme', next);
        sync();
      });
    })();
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
